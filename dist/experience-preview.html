    .current-fx,.affinity-fx { position:absolute; inset:0; overflow:hidden; }
    .current-rays { position:absolute; inset:-75%; opacity:calc(.12 * var(--int)); filter:blur(9px); animation:existing-spin calc(96s/var(--spd)) linear infinite; }

.itemx2-detail-stack {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  min-width: 0;
}
.itemx2-detail-stack > * {
  flex-shrink: 0;
}
.itemx2-change-note,
.itemx2-review-note {
  position: relative;
  z-index: 2;
  margin: 12px;
  padding: 11px 13px;
  border: 1px solid rgba(166, 180, 200, 0.17);
  border-radius: 9px;
  background: rgba(8, 13, 21, 0.88);
  color: #cbd6e4;
  font-size: var(--itemx-text-sm, 0.72rem);
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.itemx2-change-note > strong {
  display: block;
  margin-bottom: 6px;
  color: #e1c68b;
  font-size: var(--itemx-text-sm, 0.72rem);
}
.itemx2-change-note > span {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 5px 9px;
  margin-top: 4px;
}
.itemx2-change-note small {
  color: #9eacbf;
  min-width: 48px;
}
.itemx2-change-note del {
  color: #a0a9b8;
  text-decoration-color: rgba(160, 169, 184, 0.45);
}
.itemx2-change-note em {
  font-style: normal;
  color: #f1e0b6;
}
.itemx2-change-note b {
  color: #8494aa;
}
.itemx2-review-note {
  display: grid;
  gap: 3px;
  background: rgba(13, 20, 30, 0.92);
  color: #a4b3c6;
}
.itemx2-review-note small {
  font-size: inherit;
}
.itemx2-review-partial {
  border-left: 3px solid #bf9461;
}
.itemx2-review-partial strong {
  color: #ecc99a;
}
.itemx2-repair-one {
  display: block;
  margin: 8px 12px 16px;
  padding: 9px 14px;
  border: 1px solid #7c684a;
  border-radius: 8px;
  background: #211e19;
  color: #f0d7a7;
  font: inherit;
  cursor: pointer;
}
.itemx2-technique-material {
  position: absolute;
  inset: 9% 5%;
  pointer-events: none;
  opacity: 0.64;
  contain: paint;
}
.itemx2-skill-form-slash .itemx2-technique-material {
  background: linear-gradient(
    147deg,
    transparent 43%,
    color-mix(in srgb, var(--p) 35%, transparent) 46%,
    rgba(250, 247, 224, 0.9) 46.4%,
    transparent 47.3% 56%,
    color-mix(in srgb, var(--p) 35%, transparent) 57%,
    transparent 59%
  );
  clip-path: polygon(8% 91%, 29% 46%, 94% 6%, 77% 44%, 47% 67%);
  animation: itemx2-technique-shear 6s ease-in-out infinite;
}
.itemx2-skill-form-ward .itemx2-technique-material {
  inset: 8% 12%;
  background:
    linear-gradient(
      124deg,
      transparent 20%,
      color-mix(in srgb, var(--p) 24%, transparent) 21% 49%,
      rgba(235, 248, 255, 0.45) 50%,
      transparent 51%
    ),
    linear-gradient(36deg, transparent 38%, color-mix(in srgb, var(--p) 26%, transparent) 39% 70%, transparent 71%);
  clip-path: polygon(24% 0, 81% 11%, 94% 62%, 55% 99%, 8% 75%, 0 22%);
  animation: itemx2-technique-ward 9s ease-in-out infinite alternate;
}
.itemx2-skill-form-heal .itemx2-technique-material {
  inset: 0 9%;
  background:
    radial-gradient(ellipse at 36% 80%, color-mix(in srgb, var(--p) 45%, transparent), transparent 45%),
    radial-gradient(ellipse at 68% 30%, rgba(255, 245, 206, 0.24), transparent 51%);
  mask: linear-gradient(120deg, transparent 10%, #000 45% 72%, transparent);
  animation: itemx2-technique-rise 9s ease-in-out infinite alternate;
}
.itemx2-skill-form-shadow .itemx2-technique-material {
  background:
    radial-gradient(ellipse at 41% 53%, rgba(3, 3, 9, 0.94) 15%, transparent 62%),
    linear-gradient(
      114deg,
      transparent 25%,
      color-mix(in srgb, var(--p) 36%, transparent) 27%,
      transparent 29% 69%,
      rgba(204, 176, 238, 0.22) 71%,
      transparent 73%
    );
  clip-path: polygon(0 12%, 85% 0, 65% 38%, 100% 58%, 73% 96%, 16% 79%);
  animation: itemx2-technique-shadow 11s ease-in-out infinite alternate;
}
@keyframes itemx2-technique-shear {
  0%,
  72%,
  100% {
    opacity: 0.32;
    transform: translate(-3px, 2px);
  }
  80% {
    opacity: 0.8;
    transform: translate(4px, -3px);
  }
}
@keyframes itemx2-technique-ward {
  from {
    opacity: 0.32;
    transform: translate(-2px, 2px);
  }
  to {
    opacity: 0.62;
    transform: translate(3px, -2px);
  }
}
@keyframes itemx2-technique-rise {
  from {
    opacity: 0.35;
    transform: translateY(6px);
  }
  to {
    opacity: 0.65;
    transform: translateY(-6px);
  }
}
@keyframes itemx2-technique-shadow {
  from {
    opacity: 0.48;
    transform: translateX(-4px);
  }
  to {
    opacity: 0.78;
    transform: translateX(4px);
  }
}
.itemx2-skill-type-passive .itemx2-technique-material {
  animation-duration: 16s;
}
.itemx2-skill-type-sealed .itemx2-technique-material,
.itemx2-skill-status-sealed .itemx2-technique-material {
  animation: none;
  opacity: 0.22;
}
.itemx2-skill-status-lost .itemx2-technique-material {
  animation: none;
  opacity: 0.1;
}
.itemx2-blend-fire-ice .affinity-fx::after {
  content: '';
  position: absolute;
  inset: 18% 8%;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 34% 77%, rgba(195, 210, 218, 0.17), transparent 40%),
    radial-gradient(ellipse at 72% 35%, rgba(239, 218, 206, 0.12), transparent 46%);
}
.itemx2-blend-dark-lightning .lightning-field {
  clip-path: polygon(6% 0, 73% 0, 59% 24%, 97% 42%, 58% 60%, 82% 100%, 0 100%, 28% 65%, 4% 41%);
}
.itemx2-blend-fire-wind .sig-fire {
  transform-origin: 30% 85%;
  rotate: -13deg;
}
.itemx2-blend-ice-light .ice-cracks {
  background-color: rgba(235, 240, 216, 0.025);
}
.itemx2-event-burst {
  display: none;
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  contain: paint;
}
.itemx2-burst-active > .itemx2-event-burst {
  display: block;
  animation: itemx2-event-reveal 1.25s ease-out both;
}
.itemx2-burst-enhanced {
  background: linear-gradient(
    125deg,
    transparent 25%,
    rgba(230, 190, 108, 0.16) 40%,
    rgba(255, 238, 172, 0.6) 44%,
    transparent 49%
  );
}
.itemx2-burst-damage {
  background: linear-gradient(
    120deg,
    transparent 37%,
    rgba(236, 151, 131, 0.5) 38%,
    transparent 39% 62%,
    rgba(189, 118, 107, 0.3) 63%,
    transparent 64%
  );
  clip-path: polygon(23% 0, 63% 0, 48% 39%, 73% 65%, 46% 100%, 39% 100%, 58% 63%, 32% 38%);
}
.itemx2-burst-learned {
  background: radial-gradient(ellipse at 30% 45%, var(--pg, rgba(154, 128, 233, 0.35)), transparent 58%);
}
.itemx2-burst-resolved {
  background: linear-gradient(120deg, rgba(148, 159, 175, 0.3), rgba(38, 42, 51, 0.25), transparent);
  animation-name: itemx2-event-resolve !important;
}
@keyframes itemx2-event-reveal {
  0% {
    opacity: 0;
