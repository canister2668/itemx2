name: ITEMX plugin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node --check dist/itemx2.plugin.js
      - name: Verify generated bundle is committed
        run: git diff --exit-code -- dist/
      - run: npm run format:check
