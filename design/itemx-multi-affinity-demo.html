<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ITEMX 다중 속성 동작 시안</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Pretendard, "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #080a10; color: #e6ebf4; }
    button, select { font: inherit; }
    button { color: inherit; }

    .risu-shell { min-height: 100vh; background: radial-gradient(900px 560px at 50% 20%, #171b27 0, #0b0e15 55%, #07090e 100%); }
    .risu-topbar { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid #202532; background: rgba(12,15,23,.94); color: #aeb7c9; font-size: 13px; }
    .risu-topbar strong { color: #f2f4f8; font-size: 14px; }
    .stage { width: min(920px, 100%); margin: 0 auto; padding: 22px 18px 64px; }
    .demo-note { display: flex; align-items: center; gap: 9px; margin: 0 auto 14px; width: min(760px,100%); padding: 9px 12px; border: 1px solid #30394a; border-radius: 10px; background: #111622; color: #919db2; font-size: 12px; line-height: 1.45; }
    .demo-note b { color: #d8b25c; white-space: nowrap; }

    .lab { width: min(760px, 100%); margin: 0 auto 14px; padding: 12px; border: 1px solid #252c3a; border-radius: 13px; background: rgba(13,17,26,.96); }
    .lab-title { margin-bottom: 9px; color: #8e9ab0; font-size: 10px; font-weight: 800; letter-spacing: .22em; }
    .lab-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 8px; }
    .lab label { display: grid; gap: 5px; color: #79869d; font-size: 11px; }
    .lab select, .lab button { min-height: 34px; border: 1px solid #31394a; border-radius: 8px; background: #171c28; color: #d9dfeb; padding: 0 9px; }
    .lab button { cursor: pointer; }
    .lab button[aria-pressed="true"] { border-color: #806a3d; background: #2a2418; color: #f0d79d; }

    /* Current ITEMX inventory shell, reproduced from the module's rendered screen. */
    .itemx-panel { display: flex; flex-direction: column; width: min(560px,100%); margin: 0 auto; overflow: hidden; border: 1px solid #232c3d; border-radius: 14px; background: #0a0d14; color: #e6ebf4; font-size: .9rem; box-shadow: 0 24px 70px rgba(0,0,0,.48); }
    .itemx-ph { display: flex; align-items: center; gap: .45em; padding: 1em 1.05em .85em; border-bottom: 1px solid rgba(212,175,110,.14); background: radial-gradient(120% 150% at 18% -40%,rgba(212,175,110,.10),transparent 55%),linear-gradient(180deg,#131a28,#0c1019); }
    .itemx-ph-text { display: flex; flex: 1; flex-direction: column; gap: .15em; min-width: 0; }
    .itemx-ph-eyebrow { color: #b39355; font-size: .6rem; font-weight: 700; letter-spacing: .3em; }
    .itemx-ph-title { color: #f4f0e6; font-size: 1.12rem; font-weight: 800; }
    .itemx-ph-sub { color: #77839c; font-size: .72rem; }
    .itemx-ph-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.06); border-radius: 10px; background: rgba(255,255,255,.03); color: #8b99b2; }
    .itemx-seg { display: flex; gap: .15em; margin: .35em 1.05em 0; overflow-x: auto; border-bottom: 1px solid #171d2b; scrollbar-width: none; }
    .itemx-seg-i { flex: 0 0 auto; min-height: 38px; display: inline-flex; align-items: center; gap: .32em; padding: 0 .6em; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #6e7b93; font-size: .78rem; cursor: pointer; }
    .itemx-seg-on { border-bottom-color: #d4af6e; color: #f2ead9; font-weight: 700; }
    .itemx-seg-n { opacity: .65; font-size: .92em; }
    .itemx-tools { display: flex; gap: .4em; margin: .6em 1.05em 0; }
    .itemx-tool,.itemx-search { min-height: 34px; display: inline-flex; align-items: center; padding: 0 .7em; border: 1px solid rgba(255,255,255,.06); border-radius: 9px; background: rgba(255,255,255,.025); color: #93a2ba; font-size: .76rem; }
    .itemx-search { flex: 1; color: #64718c; }
    .itemx-body { padding: .75em 1.05em .95em; }
    .itemx-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .55em; }
    .itemx-tile { --rk:#8b94a6; --rks:rgba(139,148,166,.38); position: relative; display: grid; grid-template-columns: 2.4em minmax(0,1fr); grid-template-rows: 1fr auto; gap: .15em .6em; height: 82px; padding: .6em .7em .55em .85em; overflow: hidden; border: 1px solid #1c2331; border-radius: 13px; background: linear-gradient(160deg,#121826,#0d111b 78%); text-align: left; cursor: pointer; }
    .itemx-tile:hover,.itemx-tile:focus-visible { border-color: var(--p,#d4af6e); outline: none; background: #141d2c; }
    .itemx-tile-bar { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--rk); }
    .itemx-tile-eq { position: absolute; top: 0; right: 0; border-top: 16px solid #ffd479; border-left: 16px solid transparent; opacity: .85; }
    .itemx-tile-em { grid-row: 1/span 2; align-self: center; width: 2.55em; height: 2.55em; display: grid; place-items: center; border: 1px solid var(--rks); border-radius: 11px; background: radial-gradient(85% 85% at 50% 28%,var(--rks),transparent 80%); font-size: 1.1em; }
    .itemx-tile-nm { align-self: center; overflow: hidden; color: #edf2fb; font-size: .85rem; font-weight: 700; line-height: 1.32; }
    .itemx-tile-meta { display: flex; justify-content: space-between; gap: .5em; align-self: end; }
    .itemx-tile-rk { color: var(--rk); font-size: .7rem; font-weight: 700; }
    .itemx-tile-lc { color: #67748c; font-size: .7rem; }
    .itemx-tile-aff { position:absolute; right:8px; top:7px; display:flex; gap:2px; font-size:9px; filter:drop-shadow(0 0 4px rgba(0,0,0,.8)); }
    .itemx-pf { padding: .68em 1.1em; border-top: 1px solid #171d2b; color: #59657a; font-size: .7rem; text-align: right; }

    /* Off-screen cards keep their effects and DOM, while the browser may skip
       their layout and paint work until they approach the viewport. */
    .itemx-card { content-visibility:auto; contain:layout paint style; contain-intrinsic-size:auto 520px; }

    /* Detail card keeps ITEMX's real visual contract. Current theme effects and
       the proposed affinity effects are deliberately separate layers. */
    .itemx-back { display: inline-block; margin-bottom: .7em; border: 0; background: transparent; color: #9eabbf; font-size: .78rem; cursor: pointer; }
    .itemx-detail { display: flex; justify-content: center; }
    .itemx-card { --bg:#1c1610; --surf:rgba(92,74,46,.18); --fg:#e8dcc2; --dim:#a89372; --line:#5c4a2e; --p:#ff7a3d; --pg:rgba(255,122,61,.42); --s:#86e5c4; --sg:rgba(134,229,196,.34); --rk:#f0a640; --rks:rgba(240,166,64,.5); --int:.72; --spd:1.25; position: relative; width: min(360px,100%); overflow: hidden; isolation: isolate; border: 1px solid var(--line); border-radius: 3px; background: repeating-linear-gradient(102deg,rgba(255,235,190,.028) 0 2px,transparent 2px 7px),repeating-linear-gradient(11deg,rgba(0,0,0,.14) 0 3px,transparent 3px 9px),radial-gradient(120% 80% at 50% -10%,#2b2117,#17120c 70%); color: var(--fg); font-family: "Nanum Myeongjo","Noto Serif KR",Georgia,serif; font-size: .92rem; line-height: 1.62; box-shadow: inset 0 0 60px rgba(0,0,0,.55),0 0 calc(30px*var(--int)) var(--pg); }
    .craft-forged { --surf:rgba(74,60,45,.26);--fg:#f0e7dc;--dim:#b3a08c;--line:#4a3c2d;border-width:2px;border-radius:2px;background:repeating-linear-gradient(-14deg,rgba(255,255,255,.022) 0 2px,transparent 2px 11px),linear-gradient(168deg,#221d19,#0d0c0b 74%);font-family:Inter,Pretendard,sans-serif; }
    .craft-oriental { --surf:rgba(215,192,146,.075);--fg:#eee8dd;--dim:#aaa194;--line:#59482e;border-radius:2px;background:radial-gradient(100% 62% at 88% 0,rgba(135,89,35,.15),transparent 62%),repeating-linear-gradient(93deg,rgba(235,214,173,.018) 0 1px,transparent 1px 5px),repeating-linear-gradient(4deg,rgba(235,214,173,.014) 0 1px,transparent 1px 7px),linear-gradient(150deg,#191815,#0d1011 52%,#17130f);color:var(--fg);box-shadow:inset 0 0 0 1px #151717,inset 0 0 52px rgba(0,0,0,.48),0 0 calc(24px*var(--int)) var(--pg); }
    .craft-clockwork { --surf:rgba(107,81,44,.2);--fg:#e3d5b8;--dim:#9d8a68;--line:#6b512c;border-width:2px;border-radius:4px;background:repeating-linear-gradient(88deg,rgba(255,220,160,.035) 0 1px,transparent 1px 3px),linear-gradient(160deg,#241d15,#14100b 72%);font-family:ui-monospace,monospace; }
    .craft-synthetic { --surf:rgba(31,53,70,.35);--fg:#d6e6ef;--dim:#6d8496;--line:#1f3546;border-radius:0;background:repeating-linear-gradient(0deg,rgba(120,220,255,.045) 0 1px,transparent 1px 4px),linear-gradient(150deg,#0d1420,#070a11 70%);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 24px),calc(100% - 24px) 100%,12px 100%,0 calc(100% - 12px));font-family:ui-monospace,monospace; }
    .craft-celestial { --surf:rgba(45,61,117,.28);--fg:#dfe7ff;--dim:#8e9ccb;--line:#2d3d75;border-radius:3px 3px 22px 22px;background:radial-gradient(90% 60% at 50% -8%,rgba(255,217,138,.16),transparent 62%),radial-gradient(120% 100% at 50% 110%,#14204a,transparent 60%),linear-gradient(180deg,#070b1c,#050813); }
    .craft-organic { --surf:rgba(44,74,51,.3);--fg:#dcecd8;--dim:#86a78d;--line:#2c4a33;border-radius:22px 4px 22px 4px;background:radial-gradient(100% 70% at 22% -6%,rgba(127,224,161,.1),transparent 60%),radial-gradient(120% 90% at 80% 110%,rgba(30,90,60,.5),transparent 62%),linear-gradient(170deg,#0d1b12,#071008);font-family:Inter,Pretendard,sans-serif; }
    .craft-forged .itemx-medallion,.craft-oriental .itemx-medallion{border-radius:3px}.craft-synthetic .itemx-medallion{border-radius:0;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}.craft-organic .itemx-medallion{border-radius:60% 12% 60% 12%}.craft-celestial .itemx-medallion{border-radius:50%}.craft-oriental .itemx-name{color:#f2eadb;text-shadow:0 1px 2px #000,0 0 7px rgba(232,210,170,.16)}.craft-oriental .itemx-badge,.craft-oriental .itemx-subline{color:#aaa194}.craft-oriental .itemx-eyebrow{color:#bb9659;letter-spacing:.2em}.craft-oriental .itemx-head{padding-right:2.55em}.craft-oriental .itemx-effect,.craft-oriental .itemx-stat{background:rgba(7,9,9,.38)}
    .itemx-oriental-paper,.itemx-oriental-ink,.itemx-oriental-frame,.itemx-oriental-seal{display:none;position:absolute;pointer-events:none}
    .craft-oriental .itemx-oriental-paper{display:block;inset:0;z-index:0;opacity:.32;background:repeating-linear-gradient(92deg,transparent 0 8px,rgba(224,200,154,.025) 9px,transparent 10px 17px),repeating-linear-gradient(4deg,transparent 0 10px,rgba(224,200,154,.018) 11px,transparent 12px 20px)}
    .craft-oriental .itemx-oriental-ink{display:block;z-index:1;border:1px solid rgba(216,193,148,.08);border-radius:50%;filter:blur(1px);opacity:.7}
    .craft-oriental .itemx-oriental-ink-a{width:78%;height:44%;right:-35%;top:7%;transform:rotate(-12deg);box-shadow:0 0 22px rgba(178,126,60,.05)}
    .craft-oriental .itemx-oriental-ink-b{width:64%;height:36%;left:-34%;bottom:4%;transform:rotate(16deg);border-color:rgba(146,42,47,.09)}
    .craft-oriental .itemx-oriental-frame{display:block;inset:10px;z-index:5;border:1px solid rgba(210,178,111,.18);box-shadow:inset 0 0 18px rgba(0,0,0,.18)}
    .craft-oriental .itemx-oriental-frame::before,.craft-oriental .itemx-oriental-frame::after{content:"";position:absolute;width:18px;height:18px;border-color:rgba(229,195,125,.55);border-style:solid}
    .craft-oriental .itemx-oriental-frame::before{left:-4px;top:-4px;border-width:2px 0 0 2px}
    .craft-oriental .itemx-oriental-frame::after{right:-4px;bottom:-4px;border-width:0 2px 2px 0}
    .craft-oriental .itemx-oriental-seal{display:grid;place-items:center;right:16px;top:18px;z-index:6;width:31px;height:38px;border:1px solid rgba(214,82,73,.66);background:rgba(116,20,25,.38);color:#e09186;font-size:.62em;font-weight:800;line-height:1.05;text-align:center;box-shadow:inset 0 0 0 2px rgba(18,8,8,.36),0 0 9px rgba(175,34,40,.16);transform:rotate(2deg)}
    .itemx-card::before { content:""; position:absolute; inset:0 0 auto; z-index:6; height:2px; background:linear-gradient(90deg,transparent,var(--rk) 18%,var(--rk) 82%,transparent); opacity:.85; }
    .itemx-fx,.itemx-cond { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    .itemx-fx { z-index:1; }
    .itemx-cond { z-index:2; }
    .craft-oriental .itemx-fx{z-index:2}.craft-oriental .current-fx{opacity:.42}.craft-oriental .current-fog{opacity:.28}.craft-oriental .current-veil,.craft-oriental .current-rays{opacity:.44}.craft-oriental .affinity-fx{z-index:3;filter:saturate(1.2) brightness(1.16)}
    /* Existing ITEMX effects: arcane gold rays and deterministic gold shards. */
    .current-fx,.affinity-fx { position:absolute; inset:0; overflow:hidden; }
    .current-rays { position:absolute; inset:-75%; opacity:calc(.12 * var(--int)); filter:blur(9px); animation:existing-spin calc(96s/var(--spd)) linear infinite; }
    .current-rays i { position:absolute; top:50%; left:50%; width:var(--w); height:100%; transform:translateX(-50%) translateY(-100%) rotate(var(--r)); transform-origin:center bottom; border-radius:80% 80% 0 0; background:linear-gradient(to top,var(--p),transparent 49%); }
    .current-veil { position:absolute; top:-55%; right:0; left:0; height:85%; background:linear-gradient(to bottom,transparent,var(--pg),transparent); filter:blur(15px); animation:existing-veil calc(8.5s/var(--spd)) ease-in-out infinite; }
    .craft-mote { position:absolute; left:var(--x); top:108%; width:var(--z); height:var(--mh); border-radius:42% 42% 56% 56%/62% 62% 38% 38%; background:linear-gradient(to top,var(--ca),transparent); box-shadow:0 0 6px var(--ca); opacity:var(--o); animation:existing-rise var(--d) linear infinite; animation-delay:var(--delay); }
    .craft-mote.diamond { height:var(--z); border-radius:0; background:linear-gradient(135deg,var(--ca),var(--cb)); transform:rotate(45deg); }
    .craft-mote.shape-ash { height:var(--z);border-radius:62% 38% 55% 45%;background:radial-gradient(circle at 38% 34%,var(--ca),var(--cb) 72%,transparent); }
    .craft-mote.shape-petal { height:var(--mh);border-radius:100% 6% 100% 6%;background:linear-gradient(140deg,var(--ca),var(--cb)); }
    .craft-mote.shape-block { height:var(--z);border-radius:0;background:var(--ca);box-shadow:1px 0 0 var(--cb); }
    .craft-mote.shape-streak { width:2px;height:var(--mh);border-radius:2px;background:linear-gradient(to top,transparent,var(--ca) 45%,transparent); }
    .craft-mote.shape-cross { height:var(--z);border-radius:0;background:linear-gradient(90deg,transparent,var(--ca),transparent); }
    .craft-mote.shape-cross::after { content:"";position:absolute;inset:-70% 42%;background:linear-gradient(to bottom,transparent,var(--cb),transparent); }
    .craft-mote.shape-gear { height:var(--z);border-radius:0;background:none;box-shadow:none;color:var(--ca);font-size:var(--mh);line-height:1; }
    .craft-mote.shape-gear::before { content:"⚙";position:absolute;inset:0; }
    .path-drift{animation-name:existing-drift}.path-pulse{animation-name:existing-pulse}.path-sway{animation-name:existing-sway}.path-turn{animation-name:existing-turn}.path-jitter{animation-name:existing-jitter}
    .current-fog { position:absolute;right:-20%;bottom:-35%;left:-20%;height:85%;background:radial-gradient(60% 60% at 30% 70%,var(--pg),transparent 70%),radial-gradient(55% 55% at 75% 60%,var(--pg),transparent 72%);filter:blur(22px);animation:existing-fog 17s ease-in-out infinite alternate; }
    .current-scan { position:absolute;top:-30%;right:0;left:0;height:42%;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.13),transparent);animation:existing-scan 5.5s linear infinite; }

    /* Proposed affinity layer. No circular pulse or generic coloured wash. */
    .affinity-fx { z-index:2; }
    .afx { position:absolute; inset:0; opacity:1; filter:saturate(1.22) brightness(1.12); }
    .afx-secondary { opacity:.68; clip-path:inset(0 0 0 46%); }
    .afx i { position:absolute; display:block; color:var(--ac); }
    .afx-fire i { left:var(--x); bottom:-12px; width:3px; height:var(--h); border-radius:60% 60% 30% 30%; background:linear-gradient(to top,transparent,var(--ac) 50%,#ffe2a6); box-shadow:0 0 7px var(--ac); transform:skewX(var(--sk)); animation:aff-fire var(--d) ease-out infinite; animation-delay:var(--delay); }
    .afx-ice i { left:var(--x); top:var(--y); width:var(--iw); height:var(--ih); background:linear-gradient(160deg,#fff 0 12%,#dff8ff 24%,var(--ac) 62%,transparent); clip-path:polygon(50% 0,82% 38%,66% 100%,29% 82%,12% 35%); filter:drop-shadow(0 0 3px #dff8ff) drop-shadow(0 0 6px var(--ac)); animation:aff-ice var(--d) linear infinite; animation-delay:var(--delay); }
    .afx-lightning b { position:absolute; width:94px; height:7px; background:linear-gradient(90deg,transparent,var(--ac),#fff 48%,var(--ac),transparent); clip-path:polygon(0 38%,35% 18%,40% 60%,66% 5%,62% 48%,100% 28%,100% 65%,61% 78%,56% 45%,42% 100%,34% 58%,0 76%); filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px var(--ac)); opacity:0; animation:aff-lightning var(--d) step-end infinite; animation-delay:var(--delay); transform:rotate(var(--r)); }
    .afx-wind i { left:-24%; top:var(--y); width:52%; height:1px; background:linear-gradient(90deg,transparent,var(--ac) 36%,transparent); box-shadow:0 0 5px var(--ac); transform:skewX(-24deg); animation:aff-wind var(--d) ease-in-out infinite; animation-delay:var(--delay); }
    .afx-earth i { left:var(--x); bottom:-6px; width:var(--z); height:var(--z); background:linear-gradient(145deg,#f2cf8a,var(--ac) 52%,#4b3219); clip-path:polygon(16% 4%,92% 18%,75% 92%,8% 70%); filter:drop-shadow(0 0 3px var(--ac)); animation:aff-earth var(--d) ease-out infinite; animation-delay:var(--delay); }
    .afx-light i { left:var(--x); top:-20%; width:var(--z); height:135%; transform:skewX(-18deg); background:linear-gradient(to bottom,transparent,var(--ac) 38%,transparent 72%); filter:blur(2px); animation:aff-light var(--d) ease-in-out infinite alternate; animation-delay:var(--delay); }
    .afx-dark i { left:var(--x); top:var(--y); width:var(--z); height:var(--h); background:linear-gradient(to bottom,transparent,var(--ac),transparent); transform:skewX(var(--sk)); filter:blur(4px); animation:aff-dark var(--d) ease-in-out infinite alternate; animation-delay:var(--delay); }
    .afx-poison i { left:var(--x); top:var(--y); width:var(--z); height:var(--ph); border-radius:65% 35% 60% 40%; background:linear-gradient(145deg,#eaff9a,var(--ac) 58%,transparent); box-shadow:0 0 6px var(--ac); animation:aff-poison var(--d) ease-in-out infinite; animation-delay:var(--delay); }
    .afx-blood i { left:var(--x); top:-15%; width:var(--z); height:var(--h); border-radius:0 0 70% 30%; background:linear-gradient(to bottom,var(--ac),transparent); box-shadow:0 4px 7px var(--ac); animation:aff-blood var(--d) ease-in infinite; animation-delay:var(--delay); }
    .afx-void i { left:var(--x); top:var(--y); width:var(--z); height:2px; transform:rotate(var(--r)) skewX(-34deg); background:linear-gradient(90deg,transparent,#fff 16%,var(--ac) 48%,transparent); box-shadow:0 0 5px var(--ac),0 0 12px var(--ac); animation:aff-void var(--d) step-end infinite; animation-delay:var(--delay); }
    /* A second, broad signature per affinity. Particles provide detail; these
       edge traces make the affinity readable before the viewer studies them. */
    .affinity-signature { position:absolute; inset:0; color:var(--ac); pointer-events:none; mix-blend-mode:screen; opacity:.76; }
    .affinity-signature.secondary { opacity:.48; clip-path:inset(0 0 0 48%); }
    .sig-fire { background:repeating-linear-gradient(0deg,transparent 0 36px,color-mix(in srgb,var(--ac) 12%,transparent) 38px,color-mix(in srgb,var(--ac) 38%,transparent) 39px,transparent 42px 76px); filter:blur(2px) drop-shadow(0 0 7px var(--ac)); animation:sig-fire 5.2s linear infinite; }

    const rarityVars=r=>`rarity-${r}`;

    function currentEffects(craft,rarity){const spec=crafts[craft]||crafts.arcane,ambientLevel={normal:1,magic:2,rare:3,unique:3,epic:4,legendary:4,mythical:5,empyrean:5},level=ambientLevel[rarity]||1,particleCount=16;let rays='';if(spec.ambient.rays&&level>=spec.ambient.rays)[4,44,77,119,158,196,233,271,306,339].forEach((r,i)=>rays+=`<i style="--r:${r}deg;--w:${[5.1,2.8,7.4,3.3,6,4.2,8.1,3,5.6,2.5][i]}%"></i>`);let motes='';for(let i=0;i<particleCount;i++){const z=2+(i%5)*.75,shape=spec.shapes[i%spec.shapes.length],path=spec.paths[(i*3+1)%spec.paths.length],pair=spec.colors[i%spec.colors.length];motes+=`<i class="craft-mote shape-${shape} path-${path} ${shape==='diamond'?'diamond':''}" style="--x:${(i*43)%103}%;--z:${z}px;--mh:${z*2.8}px;--ca:${pair[0]};--cb:${pair[1]};--o:${.22+(i%4)*.1};--d:${7+(i%8)}s;--delay:-${(i%9)*.75}s;--drift:${-34+(i*19)%69}px;--drift2:${(34-(i*19)%69)*.7}px"></i>`}const fog=spec.ambient.fog&&level>=spec.ambient.fog?'<div class="current-fog"></div>':'',scan=spec.ambient.scan&&level>=spec.ambient.scan?'<div class="current-scan"></div>':'',veil=spec.ambient.veil&&level>=spec.ambient.veil?'<div class="current-veil"></div>':'';return `<div class="current-fx">${rays?`<div class="current-rays">${rays}</div>`:''}${fog}${scan}${veil}${motes}</div>`}
    function affinityEffects(k,role){if(!k)return'';const a=affinities[k],tag=k==='lightning'?'b':'i';let bits='';let n=k==='lightning'?14:(k==='ice'?24:(k==='wind'?11:19));if(role==='secondary')n=Math.ceil(n*.68);for(let i=0;i<n;i++){const style=`--x:${(i*37+11)%98}%;--y:${(i*29+7)%91}%;--z:${4+(i%5)*2.3}px;--h:${24+(i%6)*9}px;--iw:${2.5+(i%5)*1.4}px;--ih:${10+(i%5)*3.5}px;--ph:${7+(i%5)*2.4}px;--d:${2.5+(i%7)*.76}s;--delay:-${(i%8)*.63}s;--drift:${-42+(i*23)%85}px;--sk:${-18+(i*11)%37}deg;--r:${-38+(i*31)%77}deg;--ac:${a.c}`;bits+=`<${tag} style="${style}"></${tag}>`}let extra='';if(k==='lightning')extra=`<div class="lightning-field ${role==='secondary'?'secondary':''}" style="--ac:${a.c}"></div>`;if(k==='ice')extra=`<div class="ice-cracks ${role==='secondary'?'secondary':''}" style="--ac:${a.c}"></div>`;const signature=k==='ice'?'':`<div class="affinity-signature sig-${k} ${role==='secondary'?'secondary':''}" style="--ac:${a.c}"></div>`;return `${signature}${extra}<div class="afx afx-${k} ${role==='secondary'?'afx-secondary':''}" style="--ac:${a.c}">${bits}</div>`}
    function affinityUi(it){if(!it.p)return '<span class="affinity-chip" style="--chip:#a89372">◇ 무속성 <small>기존 연출만</small></span>';const a=affinities[it.p];let out=`<span class="affinity-chip" style="--chip:${a.c}">${a.icon} ${a.name}<small>${it.s?'주속성':'단일 속성'}</small></span>`;if(it.s){const b=affinities[it.s],rx=reactionFor(it.p,it.s);out+=`<span class="affinity-chip" style="--chip:${b.c}">${b.icon} ${b.name}<small>부속성</small></span><span class="affinity-chip reaction-chip">✦ ${rx[0]}</span>`}return out}

    function card(it){const craft=it.craft||'arcane',fx=effectText(it),extra=it.s?'<div class="itemx-effect"><span class="itemx-efname">쌍성 공명</span> <span>주속성과 부속성 효과가 서로 다른 영역과 주기로 나타난다.</span></div>':'';return `<article class="itemx-card craft-${craft} ${rarityVars(it.rarity)} ${it.condition?'condition-'+it.condition:''} ${$('#motion').getAttribute('aria-pressed')==='true'?'motion-off force-motion':''}" id="activeCard"><div class="itemx-fx">${currentEffects(craft,it.rarity)}<div class="affinity-fx">${affinityEffects(it.p,'primary')}${affinityEffects(it.s,'secondary')}</div></div><div class="itemx-cond"></div><div class="itemx-content"><div class="itemx-head"><div class="itemx-medallion"><span class="itemx-emoji">${it.emoji}</span></div><div class="itemx-titles"><div class="itemx-eyebrow">${crafts[craft].eyebrow}</div><span class="itemx-name">${it.name}</span><span class="itemx-tier">${it.display}</span><span class="itemx-subline"><span>보유 · ${it.loc}</span><span>${it.type}</span></span></div></div><div class="affinity-row">${affinityUi(it)}</div><div class="itemx-rule"></div><div class="itemx-stats"><div class="itemx-stat"><span class="itemx-statk">위력</span><span class="itemx-statv">${it.power}</span></div><div class="itemx-stat"><span class="itemx-statk">내구</span><span class="itemx-statv">${it.dur}</span></div></div><div class="itemx-gap"></div><div class="itemx-section-label">특수 효과</div><div class="itemx-effects"><div class="itemx-effect"><span class="itemx-efname">${fx[0]}</span> <span>${fx[1]}</span></div>${extra}</div><div class="itemx-flavor">${crafts[craft].name} 테마 기본 파티클 16개 위에 속성 효과가 별도 레이어로 추가된다.</div></div></article>`}

    function renderDetail(){if(!active.p)active.s=null;if(active.s===active.p)active.s=null;$('#secondary').value=active.s||'none';$('#secondary').disabled=!active.p;$('#detail').innerHTML=card(active);applyVars($('#activeCard'),active.p,active.s,active.craft||'arcane')}
