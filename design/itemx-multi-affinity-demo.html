<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <!-- Styles live in src/. This mockup consumes them so the design and the

  <link rel="stylesheet" href="../src/shell.css">
  <link rel="stylesheet" href="../src/cards.css">
  <link rel="stylesheet" href="../src/presentation.css">
</head>
<body>
  <div class="risu-shell">
    <header class="risu-topbar"><strong>ITEMX CODEX · 대화</strong><span>World Inventory & Encounter Archive</span></header>
    <main class="stage">
      <div class="demo-note"><b>PROTOTYPE v4</b><span>일곱 테마의 실제 기본 파티클을 에픽급 16개로 비교합니다. 테마 표면과 파티클은 함께 바뀌고, 속성 효과는 그 위에 별도 레이어로 추가됩니다.</span></div>
      <section class="lab" aria-label="시안 제어">
        <div class="lab-title">MULTI-AFFINITY CONTROLS</div>
        <div class="lab-grid">
          <label>테마<select id="craft"></select></label>
          <label>주속성<select id="primary"></select></label>
          <label>부속성<select id="secondary"></select></label>
          <label>등급<select id="rarity"></select></label>
          <label>연출<button id="motion" type="button" aria-pressed="false">모션 켜짐</button></label>
        </div>
      </section>

      <section class="itemx-panel" aria-label="ITEMX 인벤토리">
        <header class="itemx-ph">
          <span class="itemx-ph-text"><span class="itemx-ph-eyebrow">ITEMX CODEX · 1.2</span><span class="itemx-ph-title">인벤토리</span><span class="itemx-ph-sub">보유 21 · 장착 4 · 관찰 0 · 48,200 G</span></span>
          <span class="itemx-ph-btn">✕</span>
        </header>
        <div id="listView">
          <nav class="itemx-seg"><button class="itemx-seg-i itemx-seg-on">전체 <span class="itemx-seg-n">21</span></button><button class="itemx-seg-i">보유 <span class="itemx-seg-n">21</span></button><button class="itemx-seg-i">장착 <span class="itemx-seg-n">4</span></button><button class="itemx-seg-i">테마 <span class="itemx-seg-n">7</span></button><button class="itemx-seg-i">속성 <span class="itemx-seg-n">14</span></button></nav>
          <div class="itemx-tools"><span class="itemx-tool">⇅ 최근</span><span class="itemx-search">검색</span></div>
          <div class="itemx-body"><div class="itemx-grid" id="grid"></div></div>
          <footer class="itemx-pf">21점 표시 · 테마와 속성 비교</footer>
        </div>
        <div id="detailView" hidden>
          <div class="itemx-body"><button class="itemx-back" id="back">‹ 목록으로</button><div class="itemx-detail" id="detail"></div></div>
        </div>
      </section>
    </main>
  </div>

  <script>

    };
    const items=[

      {id:'theme_forged',emoji:'🔨',name:'용광로의 전투망치',rarity:'epic',display:'에픽',craft:'forged',p:null,s:null,type:'전투망치',loc:'소지품',power:'2600-3480',dur:'92 / 100',kind:'대장간 테마'},
      {id:'theme_oriental',emoji:'🗡️',name:'먹빛을 머금은 도',rarity:'epic',display:'에픽',craft:'oriental',p:null,s:null,type:'도',loc:'소지품',power:'2600-3480',dur:'92 / 100',kind:'무림 테마'},
      {id:'theme_clockwork',emoji:'⚙️',name:'황동 태엽검',rarity:'epic',display:'에픽',craft:'clockwork',p:null,s:null,type:'기계검',loc:'소지품',power:'2600-3480',dur:'92 / 100',kind:'시계공학 테마'},
      {id:'theme_synthetic',emoji:'🔷',name:'NX-09 절단기',rarity:'epic',display:'에픽',craft:'synthetic',p:null,s:null,type:'에너지검',loc:'소지품',power:'2600-3480',dur:'92 / 100',kind:'합성체 테마'},
      {id:'theme_celestial',emoji:'🌠',name:'성좌의 관측봉',rarity:'epic',display:'에픽',craft:'celestial',p:null,s:null,type:'관측봉',loc:'소지품',power:'2600-3480',dur:'92 / 100',kind:'천체 테마'},
      {id:'theme_organic',emoji:'🌿',name:'녹심의 생장지팡이',rarity:'epic',display:'에픽',craft:'organic',p:null,s:null,type:'지팡이',loc:'소지품',power:'2600-3480',dur:'92 / 100',kind:'유기체 테마'},
      {id:'single_fire',emoji:'🔥',name:'홍련의 심장대검',rarity:'epic',display:'에픽',p:'fire',s:null,type:'대검',loc:'장착',power:'2600-3480',dur:'83 / 100',kind:'화염 · 단일'},
      {id:'single_ice',emoji:'❄️',name:'설랑의 은월도',rarity:'epic',display:'에픽',p:'ice',s:null,type:'월도',loc:'소지품',power:'2600-3480',dur:'100 / 100',kind:'냉기 · 단일'},
      {id:'single_lightning',emoji:'⚡',name:'천뢰를 품은 왕창',rarity:'epic',display:'에픽',p:'lightning',s:null,type:'왕창',loc:'장착',power:'2600-3480',dur:'91 / 100',kind:'번개 · 단일'},
      {id:'single_wind',emoji:'🌪️',name:'청람의 유영쌍검',rarity:'epic',display:'에픽',p:'wind',s:null,type:'쌍검',loc:'소지품',power:'2600-3480',dur:'88 / 100',kind:'바람 · 단일'},
      {id:'single_earth',emoji:'🪨',name:'대맥을 울리는 철추',rarity:'epic',display:'에픽',p:'earth',s:null,type:'철추',loc:'소지품',power:'2600-3480',dur:'96 / 100',kind:'대지 · 단일'},
      {id:'single_light',emoji:'☀️',name:'여명을 긋는 성검',rarity:'epic',display:'에픽',p:'light',s:null,type:'성검',loc:'장착',power:'2600-3480',dur:'94 / 100',kind:'광휘 · 단일'},
      {id:'single_dark',emoji:'🌑',name:'월식을 머금은 흑도',rarity:'epic',display:'에픽',p:'dark',s:null,type:'흑도',loc:'소지품',power:'2600-3480',dur:'79 / 100',kind:'암흑 · 단일'},
      {id:'single_poison',emoji:'☠️',name:'녹왕의 부식단검',rarity:'epic',display:'에픽',p:'poison',s:null,type:'단검',loc:'소지품',power:'2600-3480',dur:'74 / 100',kind:'맹독 · 단일'},
      {id:'single_blood',emoji:'🩸',name:'적맥을 가르는 혈도',rarity:'epic',display:'에픽',p:'blood',s:null,type:'혈도',loc:'소지품',power:'2600-3480',dur:'86 / 100',kind:'혈기 · 단일'},
      {id:'single_void',emoji:'🕳️',name:'공백을 베는 무명검',rarity:'epic',display:'에픽',p:'void',s:null,type:'장검',loc:'소지품',power:'2600-3480',dur:'82 / 100',kind:'공허 · 단일'},
      {id:'firestorm',emoji:'⚔️',name:'홍련을 두른 폭풍검',rarity:'legendary',display:'전설',p:'fire',s:'wind',type:'장검',loc:'장착',power:'7600-9400',dur:'77 / 100',kind:'다중 속성'},
      {id:'frostbolt',emoji:'🔱',name:'빙뢰의 청람창',rarity:'mythical',display:'신화',p:'ice',s:'lightning',type:'장창',loc:'소지품',power:'17600-24400',dur:'95 / 100',kind:'다중 속성'},
      {id:'abyss',emoji:'🪄',name:'밤의 틈을 여는 지팡이',rarity:'empyrean',display:'창천',p:'dark',s:'void',type:'장궤 지팡이',loc:'소지품',power:'42000-76800',dur:'61 / 100',condition:'cursed',kind:'다중 속성'},
      {id:'venom',emoji:'🗡️',name:'적맥을 마시는 독니',rarity:'unique',display:'유니크',p:'poison',s:'blood',type:'단검',loc:'소지품',power:'880-1320',dur:'47 / 100',condition:'corrupted',kind:'다중 속성'}
    ];
    const rarityLabels={normal:'일반',magic:'매직',rare:'레어',unique:'유니크',epic:'에픽',legendary:'전설',mythical:'신화',empyrean:'창천'};
    const $=s=>document.querySelector(s);
    const keyFor=(a,b)=>[a,b].sort().join('+');
    const reactionFor=(a,b)=>reactions[keyFor(a,b)]||['이중 공명',`${affinities[a].name}과 ${affinities[b].name}의 성질이 번갈아 발현된다.`];
    const rarityVars=r=>`rarity-${r}`;
    function applyVars(el,p,s,craft='arcane'){const base=crafts[craft]||crafts.arcane,a=affinities[p]||{c:base.accent,g:base.glow},b=affinities[s]||a;el.style.setProperty('--p',a.c);el.style.setProperty('--pg',a.g);el.style.setProperty('--s',b.c);el.style.setProperty('--sg',b.g)}
    function tile(it){const icons=[it.p&&affinities[it.p].icon,it.s&&affinities[it.s].icon].filter(Boolean).join('');return `<button class="itemx-tile ${rarityVars(it.rarity)}" data-id="${it.id}"><span class="itemx-tile-bar"></span>${it.loc==='장착'?'<span class="itemx-tile-eq"></span>':''}${icons?`<span class="itemx-tile-aff">${icons}</span>`:''}<span class="itemx-tile-em">${it.emoji}</span><span class="itemx-tile-nm">${it.name}</span><span class="itemx-tile-meta"><span class="itemx-tile-rk">${it.display}</span><span class="itemx-tile-lc">${it.kind}</span></span></button>`}
    function renderGrid(){ $('#grid').innerHTML=items.map(tile).join('');document.querySelectorAll('.itemx-tile').forEach((el,i)=>{applyVars(el,items[i].p,items[i].s,items[i].craft||'arcane');el.onclick=()=>openItem(items[i])}) }
    function currentEffects(craft,rarity){const spec=crafts[craft]||crafts.arcane,ambientLevel={normal:1,magic:2,rare:3,unique:3,epic:4,legendary:4,mythical:5,empyrean:5},level=ambientLevel[rarity]||1,particleCount=16;let rays='';if(spec.ambient.rays&&level>=spec.ambient.rays)[4,44,77,119,158,196,233,271,306,339].forEach((r,i)=>rays+=`<i style="--r:${r}deg;--w:${[5.1,2.8,7.4,3.3,6,4.2,8.1,3,5.6,2.5][i]}%"></i>`);let motes='';for(let i=0;i<particleCount;i++){const z=2+(i%5)*.75,shape=spec.shapes[i%spec.shapes.length],path=spec.paths[(i*3+1)%spec.paths.length],pair=spec.colors[i%spec.colors.length];motes+=`<i class="craft-mote shape-${shape} path-${path} ${shape==='diamond'?'diamond':''}" style="--x:${(i*43)%103}%;--z:${z}px;--mh:${z*2.8}px;--ca:${pair[0]};--cb:${pair[1]};--o:${.22+(i%4)*.1};--d:${7+(i%8)}s;--delay:-${(i%9)*.75}s;--drift:${-34+(i*19)%69}px;--drift2:${(34-(i*19)%69)*.7}px"></i>`}const fog=spec.ambient.fog&&level>=spec.ambient.fog?'<div class="current-fog"></div>':'',scan=spec.ambient.scan&&level>=spec.ambient.scan?'<div class="current-scan"></div>':'',veil=spec.ambient.veil&&level>=spec.ambient.veil?'<div class="current-veil"></div>':'';return `<div class="current-fx">${rays?`<div class="current-rays">${rays}</div>`:''}${fog}${scan}${veil}${motes}</div>`}
    function affinityEffects(k,role){if(!k)return'';const a=affinities[k],tag=k==='lightning'?'b':'i';let bits='';let n=k==='lightning'?14:(k==='ice'?24:(k==='wind'?11:(k==='fire'?22:19)));if(role==='secondary')n=Math.ceil(n*.68);for(let i=0;i<n;i++){const style=`--x:${(i*37+11)%98}%;--y:${(i*29+7)%91}%;--z:${4+(i%5)*2.3}px;--h:${24+(i%6)*9}px;--iw:${2.5+(i%5)*1.4}px;--ih:${10+(i%5)*3.5}px;--ph:${7+(i%5)*2.4}px;--d:${2.5+(i%7)*.76}s;--delay:-${(i%8)*.63}s;--drift:${-42+(i*23)%85}px;--sk:${-18+(i*11)%37}deg;--r:${-38+(i*31)%77}deg;--ac:${a.c}`;bits+=`<${tag} style="${style}"></${tag}>`}const sec=role==='secondary'?' secondary':'';let extra='';if(k==='lightning')extra=`<div class="lightning-field${sec}" style="--ac:${a.c}"></div><div class="lightning-flash${sec}" style="--ac:${a.c}"></div>`;if(k==='ice')extra=`<div class="ice-cracks${sec}" style="--ac:${a.c}"></div>`;if(k==='fire')extra=`<div class="affinity-flames${sec}" style="--ac:${a.c}"><b class="af-f2"></b><b class="af-f1"></b><b class="af-f3"></b></div>`;if(k==='poison')extra=`<div class="poison-miasma${sec}" style="--ac:${a.c}"></div>`;if(k==='light')extra=`<div class="light-veilfall${sec}" style="--ac:${a.c}"></div><div class="light-ground${sec}" style="--ac:${a.c}"></div>`;const bodies={wind:'wind',earth:'earth',dark:'dark',arcane:'arcane',blood:'blood',void:'void'};if(bodies[k])extra=`<div class="affinity-body body-${bodies[k]}${sec}" style="--ac:${a.c}"></div>`;const signature=k==='ice'?'':`<div class="affinity-signature sig-${k}${sec}" style="--ac:${a.c}"></div>`;return `${signature}${extra}<div class="afx afx-${k}${role==='secondary'?' afx-secondary':''}" style="--ac:${a.c}">${bits}</div>`}
    function affinityUi(it){if(!it.p)return '<span class="affinity-chip" style="--chip:#a89372">◇ 무속성 <small>기존 연출만</small></span>';const a=affinities[it.p];let out=`<span class="affinity-chip" style="--chip:${a.c}">${a.icon} ${a.name}<small>${it.s?'주속성':'단일 속성'}</small></span>`;if(it.s){const b=affinities[it.s],rx=reactionFor(it.p,it.s);out+=`<span class="affinity-chip" style="--chip:${b.c}">${b.icon} ${b.name}<small>부속성</small></span><span class="affinity-chip reaction-chip">✦ ${rx[0]}</span>`}return out}
    function effectText(it){if(!it.p)return ['장인의 균형','속성 효과 없이 현행 ITEMX 테마 입자와 등급 연출만 표시된다.'];if(!it.s)return [`${affinities[it.p].name} 각인`,`${affinities[it.p].name} 고유 효과가 기존 금빛 테마 입자 위에 한 층 추가된다.`];return reactionFor(it.p,it.s)}
    function card(it){const craft=it.craft||'arcane',fx=effectText(it),extra=it.s?'<div class="itemx-effect"><span class="itemx-efname">쌍성 공명</span> <span>주속성과 부속성 효과가 서로 다른 영역과 주기로 나타난다.</span></div>':'';const strong=['legendary','mythical','empyrean'].includes(it.rarity);return `<article class="itemx-card craft-${craft} ${rarityVars(it.rarity)} ${strong?'itemx2-strong':''} ${it.condition?'condition-'+it.condition:''} ${$('#motion').getAttribute('aria-pressed')==='true'?'motion-off force-motion':''}" id="activeCard"><div class="itemx-fx">${currentEffects(craft,it.rarity)}<div class="affinity-fx">${affinityEffects(it.p,'primary')}${affinityEffects(it.s,'secondary')}</div></div><div class="itemx-cond"></div>${strong?'<div class="itemx-edge" aria-hidden="true"></div>':''}<div class="itemx-content"><div class="itemx-head"><div class="itemx-medallion"><span class="itemx-emoji">${it.emoji}</span></div><div class="itemx-titles"><div class="itemx-eyebrow">${crafts[craft].eyebrow}</div><span class="itemx-name">${it.name}</span><span class="itemx-tier">${it.display}</span><span class="itemx-subline"><span>보유 · ${it.loc}</span><span>${it.type}</span></span></div></div><div class="affinity-row">${affinityUi(it)}</div><div class="itemx-rule"></div><div class="itemx-stats"><div class="itemx-stat"><span class="itemx-statk">위력</span><span class="itemx-statv">${it.power}</span></div><div class="itemx-stat"><span class="itemx-statk">내구</span><span class="itemx-statv">${it.dur}</span></div></div><div class="itemx-gap"></div><div class="itemx-section-label">특수 효과</div><div class="itemx-effects"><div class="itemx-effect"><span class="itemx-efname">${fx[0]}</span> <span>${fx[1]}</span></div>${extra}</div><div class="itemx-flavor">${crafts[craft].name} 테마 기본 파티클 16개 위에 속성 효과가 별도 레이어로 추가된다.</div></div></article>`}
    let active={...items[0]};
    function openItem(it){active={...it};active.craft=active.craft||'arcane';$('#craft').value=active.craft;$('#primary').value=active.p||'none';$('#secondary').value=active.s||'none';$('#secondary').disabled=!active.p;$('#rarity').value=active.rarity;$('#listView').hidden=true;$('#detailView').hidden=false;renderDetail()}
    function renderDetail(){if(!active.p)active.s=null;if(active.s===active.p)active.s=null;$('#secondary').value=active.s||'none';$('#secondary').disabled=!active.p;$('#detail').innerHTML=card(active);applyVars($('#activeCard'),active.p,active.s,active.craft||'arcane')}
    Object.entries(crafts).forEach(([k,v])=>$('#craft').add(new Option(v.name,k)));
    $('#primary').add(new Option('◇ 없음 · 기존 효과만','none'));$('#secondary').add(new Option('— 없음 · 단일 속성','none'));
    Object.entries(affinities).forEach(([k,v])=>{$('#primary').add(new Option(`${v.icon} ${v.name}`,k));$('#secondary').add(new Option(`${v.icon} ${v.name}`,k))});
    Object.entries(rarityLabels).forEach(([k,v])=>$('#rarity').add(new Option(v,k)));
    $('#craft').onchange=e=>{active.craft=e.target.value;renderDetail()};$('#primary').onchange=e=>{active.p=e.target.value==='none'?null:e.target.value;if(!active.p)active.s=null;renderDetail()};$('#secondary').onchange=e=>{active.s=e.target.value==='none'?null:e.target.value;renderDetail()};$('#rarity').onchange=e=>{active.rarity=e.target.value;active.display=rarityLabels[e.target.value];renderDetail()};
    $('#motion').onclick=e=>{const off=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(off));e.currentTarget.textContent=off?'모션 꺼짐':'모션 켜짐';if(!$('#detailView').hidden)renderDetail()};
    $('#back').onclick=()=>{$('#detailView').hidden=true;$('#listView').hidden=false};
    renderGrid();openItem(items[8]);
  </script>
</body>
</html>
